# Prometheus Configuration for Yobhou Fintech
# Monitors: Backend, DB, Redis, OCR Worker, ELK Stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    application: 'yobhou'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Django Backend
  - job_name: 'yobhou-backend'
    static_configs:
      - targets: ['web:8000']
    metrics_path: '/metrics'
    
  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    
  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    
  # ELK Stack
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    
  - job_name: 'logstash'
    static_configs:
      - targets: ['logstash:9600']
    
  # Docker Swarm
  - job_name: 'docker'
    static_configs:
      - targets: ['docker-proxy:9323']
    
  # Node Exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
