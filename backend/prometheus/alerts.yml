# Prometheus Alert Rules for Yobhou Fintech
# Compliance: BCEAO, Banking-grade monitoring

groups:
  - name: financial_alerts
    rules:
      # Large transaction alert (> 1M GNF)
      - alert: LargeTransactionDetected
        expr: yobhou_transaction_amount > 1000000
        for: 0m
        labels:
          severity: warning
          category: financial
        annotations:
          summary: "Large transaction detected"
          description: "Transaction amount {{ $value }} GNF exceeds 1M threshold"
      
      # Transaction velocity spike
      - alert: HighTransactionVelocity
        expr: rate(yobhou_transactions_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
          category: financial
        annotations:
          summary: "High transaction velocity detected"
          description: "{{ $value }} transactions/minute in last 5 minutes"
      
      # AML flagged transactions
      - alert: AMLTransactionsFlagged
        expr: yobhou_aml_flagged_total > 0
        for: 0m
        labels:
          severity: critical
          category: compliance
        annotations:
          summary: "AML flagged transaction detected"
          description: "{{ $value }} transactions flagged for AML review"

  - name: security_alerts
    rules:
      # Failed authentication spike
      - alert: HighAuthFailures
        expr: rate(yobhou_auth_failures_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High authentication failure rate"
          description: "{{ $value }} failed auth attempts/minute"
      
      # Brute force detection
      - alert: PossibleBruteForceAttack
        expr: sum(rate(yobhou_auth_failures_total[1m])) by (user_ip) > 5
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Possible brute force attack from {{ $labels.user_ip }}"
          description: "{{ $value }} failed attempts from this IP"
      
      # Secret access
      - alert: SecretAccessDetected
        expr: yobhou_secret_access_total > 0
        for: 0m
        labels:
          severity: info
          category: security
        annotations:
          summary: "Secret accessed"
          description: "Docker secret accessed by service"

  - name: infrastructure_alerts
    rules:
      # Database down
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "PostgreSQL database is down"
          description: "Database has been down for more than 1 minute"
      
      # High database connections
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High number of database connections"
          description: "{{ $value }} active connections"
      
      # Redis down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for more than 1 minute"
      
      # Disk space low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: "Disk space is {{ $value }}%"
      
      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"
      
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"
      
      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service has been down for more than 2 minutes"
      
      # Container restarts
      - alert: ContainerRestarts
        expr: rate(container_last_seen[5m]) > 0 and container_restart_count > 0
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Container {{ $labels.name }} is restarting"
          description: "Container has restarted {{ $value }} times"

  - name: compliance_alerts
    rules:
      # Audit log gap (no logs for 5 min)
      - alert: AuditLogGap
        expr: rate(yobhou_audit_logs_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
          category: compliance
        annotations:
          summary: "No audit logs for 5 minutes"
          description: "Possible logging system failure"
      
      # Backup failure
      - alert: BackupFailed
        expr: yobhou_backup_success == 0
        for: 0m
        labels:
          severity: critical
          category: compliance
        annotations:
          summary: "Backup failed"
          description: "Latest backup job failed"
      
      # Archive upload failure
      - alert: ArchiveUploadFailed
        expr: yobhou_archive_upload_failures > 0
        for: 1h
        labels:
          severity: warning
          category: compliance
        annotations:
          summary: "Archive upload failures detected"
          description: "{{ $value }} archive upload failures in last hour"
