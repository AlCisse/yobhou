# Logstash Pipeline Configuration for Yobhou Fintech Audit Logs
# Compliance: BCEAO, RGPD-like, 10-year retention

input {
  # Docker logs
  docker {
    host => "unix:///var/run/docker.sock"
    start_position => "beginning"
  }

  # Django application logs
  beats {
    port => 5044
  }

  # Security events
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse Django logs
  if [source] == "django" {
    grok {
      match => { "message" => "\[%{LOGLEVEL:log_level}\] %{TIMESTAMP_ISO8601:timestamp} %{GREEDYDATA:log_message}" }
    }
    
    # Extract user context
    if [log_message] =~ /user_id=(?<user_id>\d+)/ {
      mutate {
        add_field => { "has_user_context" => "true" }
      }
    }
    
    # Tag security events
    if [log_message] =~ /(?i)(auth|login|logout|password|token|secret|permission)/ {
      mutate {
        add_tag => [ "security_event" ]
      }
    }
    
    # Tag financial transactions
    if [log_message] =~ /(?i)(transaction|payment|amount|invoice|meter)/ {
      mutate {
        add_tag => [ "financial_event" ]
      }
    }
  }

  # Add metadata
  mutate {
    add_field => {
      "environment" => "production"
      "application" => "yobhou"
      "compliance" => "BCEAO"
      "retention_years" => "10"
    }
  }

  # Remove sensitive fields
  mutate {
    remove_field => [ "password", "secret", "token", "authorization" ]
  }

  # Add timestamp for audit trail
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss" ]
    target => "@timestamp"
  }
}

output {
  # Primary: Elasticsearch (hot storage - 2 years)
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "yobhou-audit-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }

  # Secondary: S3 Glacier (cold storage - 10 years)
  s3 {
    bucket => "${ARCHIVE_S3_BUCKET}"
    prefix => "audit-logs/%{+YYYY}/%{+MM}/%{+dd}/"
    region => "${AWS_REGION}"
    access_key_id => "${AWS_ACCESS_KEY_ID}"
    secret_access_key => "${AWS_SECRET_ACCESS_KEY}"
    codec => json_lines
    time_zone => "UTC"
    flush_interval => 300
  }

  # Alerting: Critical security events
  if "security_event" in [tags] {
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      format => "json"
      mapping => '{
        "labels": {
          "severity": "warning",
          "alertname": "SecurityEvent",
          "application": "yobhou"
        },
        "annotations": {
          "summary": "Security event detected",
          "description": "%{message}"
        }
      }'
    }
  }
}
